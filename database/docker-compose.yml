services:
  postgres:
    image: postgres:16-alpine
    container_name: sgdpu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgdpu
      POSTGRES_USER: sgdpu
      POSTGRES_PASSWORD: sgdpu_dev
    ports:
      - "5434:5432"
    volumes:
      - sgdpu_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgdpu -d sgdpu"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sgdpu_pgdata:
