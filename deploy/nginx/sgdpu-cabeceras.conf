# Cabeceras de seguridad comunes. Se incluye en cada "location" porque nginx
# descarta los add_header del nivel superior cuando un location define los suyos.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# La cámara solo para esta app (lector de placas); nada más.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
# - 'wasm-unsafe-eval': requerido para compilar el WebAssembly de ONNX Runtime.
# - worker-src 'self': el lector corre en un Web Worker servido desde /assets.
# - style-src 'unsafe-inline': estilos en línea de React y del plano SVG.
# - Google Fonts: tipografía Open Sans (index.html).
# - blob: en img-src/media-src: miniaturas y vista previa de la cámara.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
