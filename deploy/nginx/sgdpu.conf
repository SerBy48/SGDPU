# SGDPU en producción detrás de nginx con TLS (configuración de referencia).
#
# - Sirve el frontend compilado con `npm run build:nginx` (API en el mismo
#   origen: /api y /socket.io se reenvían al backend).
# - HTTPS es obligatorio: sin él el navegador bloquea la cámara (getUserMedia).
# - Caché: los assets de Vite y los modelos llevan versión/hash en el nombre y
#   se cachean un año; index.html y models/manifest.json se revalidan siempre.
#
# Ajustar: server_name, rutas de certificados, root y la dirección del backend.
# En el backend (.env): TRUST_PROXY=1, NODE_ENV=production,
# FRONTEND_URL=https://<dominio>.
#
# Copiar a /etc/nginx/conf.d/sgdpu.conf y sgdpu-cabeceras.conf a /etc/nginx/snippets/.

upstream sgdpu_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

map $http_upgrade $sgdpu_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sgdpu.example.edu.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sgdpu.example.edu.co;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/sgdpu;          # contenido de frontend/dist
    index index.html;
    server_tokens off;

    # Un bloque "types" reemplaza los tipos heredados, por eso se incluye
    # mime.types. El .wasm debe salir como application/wasm (lo trae el
    # mime.types de las versiones recientes; si `curl -I .../assets/*.wasm` no lo
    # muestra, agregar "application/wasm wasm;" abajo). Los .onnx, binarios.
    include mime.types;
    types {
        application/octet-stream  onnx;
    }

    # El motor WASM (~15 MB) baja a ~3,8 MB con gzip; los .onnx comprimen poco.
    # build:nginx deja los .gz ya generados (scripts/precomprimir.mjs):
    # gzip_static los sirve sin gastar CPU; comprimir el .wasm al vuelo tardaba
    # varios segundos por descarga. "gzip on" queda para las respuestas de la API.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml application/wasm;

    # Aplicación (SPA): toda ruta desconocida devuelve index.html, sin caché.
    location / {
        include snippets/sgdpu-cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets de Vite (JS, CSS, worker del lector y .wasm): nombre con hash.
    location /assets/ {
        include snippets/sgdpu-cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Modelos del lector: los .onnx llevan la versión en el nombre; el manifest
    # dice cuál usar y se revalida en cada carga.
    location = /models/manifest.json {
        include snippets/sgdpu-cabeceras.conf;
        add_header Cache-Control "no-cache" always;
    }
    location /models/ {
        include snippets/sgdpu-cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API REST.
    location /api/ {
        proxy_pass http://sgdpu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;   # igual que express.json en el backend
    }

    # Tiempo real (Socket.IO, WebSocket).
    location /socket.io/ {
        proxy_pass http://sgdpu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sgdpu_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
